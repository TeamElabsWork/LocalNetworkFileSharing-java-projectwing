# Pipeline backend slots - choose the implementation of each component by NAME.
# Every module registers its backends in its own registry (see modules/<name>/README.md).
# A slot that is missing or "unset" falls back to the safe mock backend and logs it.
#
# Day 1 everything is a mock, so the app runs without any network:  make demo
# When you finish a real backend, switch ONE line here and run the app / tests again.
#
# NOTE: .properties files do not allow comments after a value - keep comments on their own lines.

# discovery: mock | udp            (modules/discovery)
backend.discovery=mock

# transport: loopback | tcp        (modules/network)
backend.transport=loopback

# files: stub | local             (modules/file)
backend.files=stub

# engine: simulated | network      (modules/transfer)
backend.engine=simulated

# Options read by backends. simulated.step_ms = speed of the simulated transfer, 0 = instant (tests)
simulated.step_ms=150
